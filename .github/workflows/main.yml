  test-emscripten:
    name: Emscripten (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Clone C3 Compiler Source
        run: git clone --depth=1 https://github.com/c3lang/c3c c3c

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: "latest"

      - name: Build static archives
        run: embuilder build libc libdlmalloc libstubs libsockets libclang_rt.builtins

      - name: Build CMake (Debug)
        run: |
          emcmake cmake -S c3c -B build-debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DC3_FETCH_LLVM=ON \
            -DC3_WITH_LLVM=ON \
            -DC3_LINK_DYNAMIC=OFF \
            -DC3_AVR_DISABLE=ON \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_EXE_LINKER_FLAGS="-sALLOW_MEMORY_GROWTH=1 -sFORCE_FILESYSTEM=1 -sEXIT_RUNTIME=0 -sINITIAL_MEMORY=256MB -sMAXIMUM_MEMORY=4GB -sSTACK_SIZE=8MB -sERROR_ON_UNDEFINED_SYMBOLS=0 -sEXPORTED_RUNTIME_METHODS=FS,callMain -sEXPORTED_FUNCTIONS=_main,_fflush"
          cmake --build build-debug

      - name: Run Unified Tests
        run: |
          # ./c3c/scripts/tools/emscripten_tests.sh "./build-debug/c3c.js"
          node ./build-debug/c3c.js --run-dir "$GITHUB_WORKSPACE/c3c" compile-run examples/args.c3 --target emscripten -o args.js -- foo -bar 'baz baz'

      
          
