  test-wasm:
    name: Wasm (x64)
    runs-on: ubuntu-24.04
    steps:
     - uses: actions/checkout@v6

     - name: Clone C3 Compiler Source
       run: git clone --depth=1 https://github.com/Darvisim/c3c -b wasm c3c
     
     - name: Install C3
       uses: Manulinares/setup-c3@v1

     - name: Setup Wasmtime
       uses: bytecodealliance/actions/wasmtime/setup@v1

     # - name: Setup Emscripten
     #   run: |
     #     git clone https://github.com/emscripten-core/emsdk.git
     #     cd emsdk
     #     ./emsdk install latest
     #     ./emsdk activate latest
     #     echo "$GITHUB_WORKSPACE/emsdk" >> $GITHUB_PATH
     #     echo "$GITHUB_WORKSPACE/emsdk/upstream/emscripten" >> $GITHUB_PATH
           
     - name: Run test
       run: |
          c3c compile c3c/resources/examples/hello_world_many.c3 --no-entry --target wasm32 -o hello_world_many.wasm
          wasmtime hello_world_many.wasm
          
