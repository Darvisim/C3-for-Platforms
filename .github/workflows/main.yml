  test-emscripten:
    name: Emscripten (x64)
    runs-on: ubuntu-24.04
    steps:
     - uses: actions/checkout@v6
     
     - name: Clone C3 Compiler Source
       run: git clone --depth=1 https://github.com/c3lang/c3c c3c

     - name: Extract c3
       run: |
         mkdir -p bin
         curl -L https://github.com/c3lang/c3c/releases/download/latest-prerelease-tag/c3-linux-debug.tar.gz -o bin/c3-linux-debug.tar.gz 
         tar -xzf bin/c3-linux-debug.tar.gz -C bin
         chmod +x bin/c3/c3c

     - name: Setup Emscripten
       run: |
         git clone https://github.com/emscripten-core/emsdk.git
         cd emsdk
         ./emsdk install latest
         ./emsdk activate latest
         echo "$GITHUB_WORKSPACE/emsdk" >> $GITHUB_PATH
         echo "$GITHUB_WORKSPACE/emsdk/upstream/emscripten" >> $GITHUB_PATH

     - name: Run test
       run: |
         ./bin/c3/c3c compile-run -O1 "c3c/test/src/test_suite_runner.c3" -o test_suite_runner.js
         node test_suite_runner.js -- ./bin/c3/c3c "c3c/test/test_suite/" "--no-terminal"
          
