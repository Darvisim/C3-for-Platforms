  build-wasi:
    name: WASI SDK Standalone Build (x64)
    runs-on: ubuntu-latest
    
    env:
      WASI_VERSION: 34.0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Clone C3 Compiler Source
        run: git clone --depth=1 https://github.com/c3lang/c3c c3c

      - name: Install and Cache WASI SDK
        id: cache-wasi
        uses: actions/cache@v5
        with:
          path: /opt/wasi-sdk
          key: ${{ runner.os }}-wasi-sdk-${{ env.WASI_VERSION }}

      - name: Download WASI SDK
        if: steps.cache-wasi.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/wasi-sdk
          curl -L https://github.com/WebAssembly/wasi-sdk/releases/latest/download/wasi-sdk-${{ env.WASI_VERSION }}-x86_64-linux.tar.gz | sudo tar -xzf - --strip-components=1 -C /opt/wasi-sdk

      - name: Setup Wasmtime Runtime (For Testing)
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: 'v49.0.1'

      - name: Build CMake with WASI Toolchain
        run: |
          cmake -S c3c -B build-wasi -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=/opt/wasi-sdk/share/cmake/wasi-sdk.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DC3_FETCH_LLVM=ON \
            -DC3_WITH_LLVM=ON \
            -DC3_LINK_DYNAMIC=OFF \
            -DC3_AVR_DISABLE=ON \
            -DCMAKE_SYSROOT=/opt/wasi-sdk/share/wasi-sysroot
          cmake --build build-wasi

      - name: Verify CLI Execution with Wasmtime
        run: |
          wasmtime run --dir=. build-wasi/c3c.wasm -- --version
          

          
          

      
          
