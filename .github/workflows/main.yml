name: CI
on:
  workflow_dispatch:

jobs:
  test-xcode:
    name: XCode (arm64)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6

      - name: Clone C3 Compiler Source
        run: git clone --depth=1 https://github.com/c3lang/c3c c3c
  
      - run: brew install llvm
      
      - name: Build CMake (Debug)
        run: |
          LLVM_PREFIX=$(brew --prefix llvm)
          
          cmake -S c3c -B build-debug \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$LLVM_PREFIX" \
            -DLLVM_DIR="${LLVM_PREFIX}/lib/cmake/llvm" \
            -DC3_LLD_DIR="${LLVM_PREFIX}/lib"
            
          cmake --build build-debug
  
      - name: Run Unified Tests
        run: bash ./c3c/scripts/tools/ci_tests.sh "./build-debug/c3c"
