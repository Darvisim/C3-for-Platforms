name: CI
on:
  workflow_dispatch:

jobs:
  test-ios:
    name: iOS (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Clone C3 Compiler Source
        run: git clone --depth=1 https://github.com/c3lang/c3c c3c
      - name: CMake Build (Host)
        run: |
          cmake -S c3c -B build-debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DC3_FETCH_LLVM=ON
          cmake --build build-debug
      - name: Setup and Boot iOS Simulator
        uses: futureware-tech/simulator-action@v6
        with:
          os: 'iOS'
          os_version: ">=18.0"
      - name: Run Unified Tests
        run: |
         SIM_HOME=$(xcrun simctl getenv booted HOME)
         cp ./c3c/* "$SIM_HOME/"
         if [ -d "$SIM_HOME/c3c" ]; then
           xcrun simctl spawn booted /bin/sh -c "$SIM_HOME/c3c/scripts/tools/ci_tests.sh ./build-debug/c3c ios"
         else
           xcrun simctl spawn booted /bin/sh -c "$SIM_HOME/scripts/tools/ci_tests.sh ./build-debug/c3c ios"
         fi
