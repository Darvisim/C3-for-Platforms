  test-emscripten:
    name: Emscripten (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Clone C3 Compiler Source
        run: git clone --depth=1 https://github.com/c3lang/c3c c3c

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: "latest"

      - name: Build static archives
        run: embuilder build libc libdlmalloc libstubs libsockets libclang_rt.builtins

      - name: Build CMake (Debug)
        run: |
          emcmake cmake -S c3c -B build-debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DC3_FETCH_LLVM=ON \
            -DC3_WITH_LLVM=ON \
            -DC3_LINK_DYNAMIC=OFF \
            -DC3_AVR_DISABLE=ON \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_EXE_LINKER_FLAGS="-sALLOW_MEMORY_GROWTH=1 -sNODERAWFS=1 -sEXIT_RUNTIME=0 -sINITIAL_MEMORY=256MB -sMAXIMUM_MEMORY=4GB -sSTACK_SIZE=8MB -sERROR_ON_UNDEFINED_SYMBOLS=0 -sEXPORTED_RUNTIME_METHODS=FS,callMain -sEXPORTED_FUNCTIONS=_main,_fflush"
          cmake --build build-debug

      - name: Run Unified Tests
        run: |
          node ./build-debug/c3c.js compile -O1 --stdlib "$GITHUB_WORKSPACE/c3c/lib" "$GITHUB_WORKSPACE/c3c/test/src/test_suite_runner.c3" -z -sERROR_ON_UNDEFINED_SYMBOLS=0 --target emscripten -o test_suite_runner.js
          sed -i '1i\
          globalThis._posix_spawnp = function(pid_ptr, path_ptr, file_actions, attrp, argv_ptr, envp_ptr) {\
            var path = UTF8ToString(path_ptr);\
            var args = [];\
            var i = 0;\
            while (true) {\
              var arg_ptr = HEAPU32[(argv_ptr >> 2) + i];\
              if (!arg_ptr) break;\
              args.push(UTF8ToString(arg_ptr));\
              i++;\
            }\
            var cmd = args.shift();\
            try {\
              var res = require("child_process").spawnSync(cmd, args, { stdio: "inherit", shell: true });\
              return res.status || 0;\
            } catch(e) {\
              return 1;\
            }\
          };' test_suite_runner.js
          node test_suite_runner.js "$GITHUB_WORKSPACE/build-debug/c3c.js" "$GITHUB_WORKSPACE/c3c/test/test_suite/" --no-terminal

      
          
