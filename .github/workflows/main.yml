  test-wasi:
    name: WASI (x64)
    runs-on: ubuntu-latest
    steps:
      -  uses: actions/checkout@v6
        
      - name: Setup WASI SDK
        uses: bytecodealliance/setup-wasi-sdk-action@v1

      - name: Setup Wasmtime Runtime (For Testing)
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Download C3 Linux prerelease
        run: |
          mkdir -p bin
          curl -fL https://github.com/c3lang/c3c/releases/download/latest-prerelease-tag/c3-linux.tar.gz -o /tmp/c3-linux.tar.gz
          tar -xzf /tmp/c3-linux.tar.gz -C bin
          chmod +x bin/c3/c3c
          bin/c3/c3c --version
  
      - name: Compile and run a WASI smoke test
        run: |
          mkdir -p build-wasi
          cat > build-wasi/hello.c3 <<'EOF'
          import std;
          fn void main() {
            io::printn("Hello from WASI");
          }
          EOF
          bin/c3/c3c compile build-wasi/hello.c3 --no-entry --target wasm32 -o build-wasi/hello.wasm
          wasmtime run --dir=. build-wasi/hello.wasm
          

          
          

      
          
