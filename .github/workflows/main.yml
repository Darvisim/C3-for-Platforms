name: CI
on:
  workflow_dispatch:
  
jobs:
  test-android:
    name: Android (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      
      - name: Clone C3 Compiler Source
        run: git clone --depth=1 https://github.com/c3lang/c3c c3c
        
      - name: Setup Termux
        uses: Darvisim/Playground@main
        with:
          arch: x86_64
  
      - name: Install dependencies
        shell: termux {0}
        run: |
          for i in 1 2; do \
            pkg update -y && \
            pkg install -y llvm binutils libgc build-essential cmake git libedit zlib clang make mlir llvm-tools libpolly python libllvm-static && break || sleep 10; \
          done
  
      - name: Build CMake (Debug)
        shell: termux {0}
        run: |
          cmake -S c3c -B build-debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-debug
  
      - name: Run Unified Tests
        shell: termux {0}
        run: |
         chmod +x ./c3c/scripts/tools/ci_tests.sh
         ./c3c/scripts/tools/ci_tests.sh "./build-debug/c3c" "android"
