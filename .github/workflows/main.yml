  test-emscripten:
    name: Emscripten (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Clone C3 Compiler Source
        run: git clone --depth=1 https://github.com/c3lang/c3c -b master --single-branch

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: "latest"

      - name: Build static archives
        run: embuilder build libc libdlmalloc libstubs libsockets libclang_rt.builtins

      - name: Build CMake (Debug)
        run: |
          emcmake cmake -S c3c -B build-debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DC3_FETCH_LLVM=ON \
            -DC3_WITH_LLVM=ON \
            -DC3_LINK_DYNAMIC=OFF
          cmake --build build-release

      - name: Run Test Runner
        run: |
          ./c3c/build-debug/c3c.js compile-run -O1 "$ROOT_DIR/test/src/test_suite_runner.c3" -- "c3c/build-debug/c3c.js" "c3c/test/test_suite/" --no-terminal

      
          
