name: CI
on:
  workflow_dispatch:

jobs:
  test-ios:
    name: iOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Clone C3 Compiler Source
        run: git clone --depth=1 https://github.com/c3lang/c3c c3c
      - name: CMake Build (Host)
        run: |
          cmake -S c3c -B build-debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-w" \
            -DC3_FETCH_LLVM=ON
          cmake --build build-debug
      - name: Setup and Boot iOS Simulator
        uses: futureware-tech/simulator-action@v6
        with:
          os: 'iOS'
          os_version: ">=18.0"
      - name: Run Unified Tests
        run: |
         HOME="$(xcrun simctl getenv booted HOME)"
         cp -R ./c3c "$HOME/"
         sh "$HOME/c3c/scripts/tools/ci_tests.sh" ./build-debug/c3c ios
