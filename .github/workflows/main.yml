name: CI
on:
  workflow_dispatch:

jobs:
  test-xcode:
    name: XCode (arm64)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6

      - name: Clone C3 Compiler Source
        run: git clone --depth=1 https://github.com/c3lang/c3c c3c
  
      - run: brew install llvm lld
      
      - name: Build CMake (Debug)
        run: |
          cmake -S c3c -B build-debug \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$(brew --prefix llvm)" \
            -DLLVM_DIR="$(brew --prefix llvm)/lib/cmake/llvm" \
            -DC3_LLD_DIR="$(brew --prefix lld)/lib"
          cmake --build build-debug
  
      - name: Run Unified Tests
        run: bash ./c3c/scripts/tools/ci_tests.sh "./build-debug/c3c"
